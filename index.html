<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Mom!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(120deg, #fffefc 70%, #ffd70010 100%);
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 60px auto;
      background: #fffefb;
      box-shadow: 0 8px 32px 0 rgba(255, 215, 0, 0.16);
      border-radius: 24px;
      padding: 36px 30px;
      text-align: center;
      border: 2.5px solid #FFD700;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .img-block {
      width: 130px;
      height: 130px;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 2px 14px 0 #FFD70055;
      border: 2.5px solid #FFD700;
      background: #fffbeae2;
      perspective: 1000px;
      transition: box-shadow 0.5s;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
      transition: transform 0.8s cubic-bezier(.65,1.56,.79,.68);
      border: 2px solid #FFD700;
    }
    .img-block:hover img {
      transform: rotate(-12deg) scale(1.12) skew(-5deg, 2deg);
      box-shadow: 0 8px 38px 0 #FFD700;
    }
    h1 {
      color: #FFD700;
      font-size: 2.7em;
      font-weight: bold;
      letter-spacing: 1.1px;
      margin-bottom: 17px;
      text-shadow: 0px 2px 18px #FFD70050;
    }
    .facts {
      margin-top: 12px;
      padding: 11px 0 9px 0;
      background: rgba(255,215,0,0.06);
      border-radius: 14px;
      font-size: 1.13em;
      color: #C19A36;
      border: 1px solid #FFD70044;
    }
    .fun-fact {
      margin: 8px 0;
      padding: 7px 0;
      border-bottom: 1px solid #FFD70030;
      font-style: italic;
    }
    .fun-fact:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Happy Birthday Mom!</h1>
    <div class="gallery">
      <div class="img-block"><img src="image1.jpg" alt="Mom Photo 1"></div>
      <div class="img-block"><img src="image2.jpg" alt="Mom Photo 2"></div>
      <div class="img-block"><img src="image3.jpg" alt="Mom Photo 3"></div>
      <div class="img-block"><img src="image4.jpg" alt="Mom Photo 4"></div>
      <div class="img-block"><img src="image5.jpg" alt="Mom Photo 5"></div>
    </div>
    <div class="facts">
      <div class="fun-fact">She makes the world's best paneer butter masala</div>
      <div class="fun-fact">Her hugs can cure any bad day.</div>
      <div class="fun-fact">She is Really Sweet</div>
      <div class="fun-fact">Her laugh makes everyone smile!</div>
      <div class="fun-fact">She loves gold jewelry and bright sunny days.</div>
    </div>
  </div>
</body>
</html>
